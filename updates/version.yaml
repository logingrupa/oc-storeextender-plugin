2.0.15:
  - 'LazyPromoBlockLoader: every promo tab is lazy, including the first, which is requested as soon as the control connects rather than built in onRun(); tab panes are switched by the control itself, because data-toggle="tab" had no Bootstrap JS behind it on migrated layouts; skeleton CSS moved out of the inline style into the theme bundle'
2.0.16:
  - 'LazyPromoBlockLoader: the skeleton reserves one placeholder per card the handler will actually return instead of a fixed five, removing 0.20 of cumulative layout shift on the home page'
2.0.17:
  - 'LazyPromoBlockLoader: the skeleton card now matches a loaded card exactly - the form wrapper product-card.htm uses, so the placeholder column and the real column are the same height and the tab does not move when the response lands'
2.0.18:
  - 'Slug-keyed pagefinder types shop-product-slug and shop-promo-block-slug. The id-keyed shop-product type loads the whole ProductItem only to read its slug - 140 queries for the home page banners on a cold cache against 0 - and stores an id that differs between environments. Promo blocks had no pagefinder type at all.'
2.0.19: storeextender:verify-xml-import-settings asserts the 1C import config is complete and unambiguous on every site, and exits non-zero when it is not. Production was importing categories with the wildcard path "//Группа", which walks all 27 nodes in the feed instead of the 5 real roots, with no "children" field to recurse the tree and no mapping for preview_text, warning, ingredients or manufacturer. system_settings is excluded from data migrations because it carries gateway credentials, so the drift could not travel and nothing detected it; duplicate rows per site made the effective value undefined, since SettingModel reads with first() and no ORDER BY.
2.0.20: The promo tab renders an empty host for its rail paging arrows instead of leaving rail-nav.js to insert one. The module docks arrows into a section heading, and the tabs have none, so it created a row above the rail after the cards arrived over AJAX and pushed the whole tab down 40px on phones. That was the last measurable layout shift on the home page. findOrCreateRailTools already adopts an existing .hr-rail-tools, so an empty one in the markup plus a min-height in the theme means the arrows land in a box that was reserved from first paint. /lv/ now measures 0.0000 cumulative layout shift on throttled mobile, plain mobile and desktop.
2.0.21: 'Offer colour sync runs hourly, only writes when the export has actually changed, and can report its own drift. The colour-lab API now sends a global last_updated_at beside the version hash, so the command records both that timestamp and the time of its own import, and a new --status mode prints the two side by side and exits non-zero when they disagree, which makes it usable as a monitor. Twice a day left a real gap: the 2026-08-05 regrouping was exported at 09:49 UTC, minutes after the 09:00 run, and would have sat unseen until 13:00. Two things had to change for an hourly check to mean anything. The client cached its payload for an hour, so a scheduled run inside that window answered from cache and would have reported no change for up to an hour after a real one; the command now forces a network check, which still costs one 304 when nothing moved because If-None-Match is unchanged. And the sync state lived in the cache, where cache:clear on every deploy took it with it, so nothing could say what had already been imported; it now lives in system_parameters. That move needed care: the version stamp kept its old cache key, and a leftover entry would have shadowed the persisted value indefinitely, so the command would have compared against a stale stamp, decided it was already in sync and never recorded anything. getVersion reads the parameter directly and a test pins that a legacy cache entry cannot answer for it.'
2.0.22: 'Quote the 2.0.21 changelog entry so October can parse this file again, and add a test that keeps it parsable. Its prose contained a colon followed by a space, which is a syntax error in an unquoted YAML mapping value, and nothing about writing it failed loudly: the plugin still loaded and its code still ran, so the sync worked everywhere it was invoked by hand. VersionManager parses this file to decide what to migrate and what to record, so the real damage was silent. The nailscosmetics.no deploy died on october:migrate, and on the .lv site the deploy reported success while system_plugin_versions stayed at 2.0.20, one release behind the code actually running. The new test parses updates/version.yaml and asserts every key is a version number with a non empty note, and it was proven by restoring the unquoted line and watching it error.'

2.0.23: 'The offer colour sync can finish, console commands can read the XML import settings, and every logingrupa plugin''s changelog is now guarded. Three faults that only nailscosmetics.no exposed. The colour client had a 3 second timeout while the export''s cold path was measured at 11.1 seconds from that box, against a 0.26 second steady state, so every hourly run died with cURL error 28 and the site had never imported a single colour row; nothing in a request path holds that client any more, since the storefront reads the local table, so the budget now costs a cron run at worst rather than a page render. XmlImportSettings was missing from the site fallback list, and because that deployment keeps its only settings row on site 1 while the primary site is 2, a console command read null for the file list, every XPath and the whole field map, which left the 1C importer unable to run from CLI at all; it never showed on .lv, where site 1 is also the primary one. Both are pinned by tests that were proven by reverting the fix. The version file guard now covers all fifteen logingrupa plugins instead of this one, because october:migrate parses every one of them and a malformed line anywhere either kills a deploy or lets it report success while system_plugin_versions stops following the code.'
2.0.24: 'The offer sheet footer payload is trimmed, so a footer with nothing in it can collapse. The product page renders no call to action in the sheet any more, because a row tap already applies the shade there, and the theme hides an empty footer with :empty - which does not match an element holding a whitespace text node. renderPartial returns the template newline around the removed button, so without the trim the footer would still have drawn its top border and 26px of padding under the shade list on every phone. Theme 2.5.11.'
2.0.25: 'The product page swatch strip gets a server renderer, so the page can filter its own shade circles by colour family without opening the sheet. onGetSwatchStrip returns the same partial the page renders on load, either every shade of one family or the window of twelve around a given shade, and the theme swaps it in; selection is applied client side, which keeps the markup free of per visitor state and cacheable under the existing hr-sheet tag beside the sheet rows it already caches. The offer id rides that cache key, so it is validated against the product first: an id from anywhere else would have minted an unbounded number of entries all holding the same head window. The strip partial is split out of the theme so one file feeds page load, a shared ?family= URL and every later render, which retired the client side copy of the swatch markup that had drifted from it. getInlineSwatchData loses its inline limit argument in favour of INLINE_LIMIT and WINDOW_BEFORE, the cache key builder is shared with the row cache rather than repeated, five methods that no theme or plugin calls drop to protected, and a @method block documenting four methods the class actually declares is gone. Theme 2.5.12.'
2.0.26: 'The shade sheet stops shipping sixty three megabytes of pictures, a whole shade window arrives in one request instead of twelve, and a fragment redraw no longer throws the shop''s popularity sorting away. OfferImageHelper is now the only place an offer picture gets a size: 96px cropped for the 48px sheet row and the 45px strip circle, 600px fitted for the sheet''s preview slot, both webp at quality 80. The strip and the sheet deliberately share the swatch size, so the sheet''s rows come out of the browser cache the product page already filled. Three templates believed they were already asking for webp and were not, because File::getThumb takes three arguments and they passed four: PHP discards the fourth and getDefaultThumbOptions rewrites the third into a bare mode, so quality never arrived and the extension fell back to the source format, and every derivative shipped as a full quality PNG. On product 366, 230 active offers, the sheet cold open goes from 63,472 KB of pictures to 250.8 KB. storeextender:warm-offer-thumbs generates the set ahead of traffic in id order and chunks of 200, resumable with --from-id and capped with --limit, because October writes a thumbnail inline on the first request that asks for it and the first visitor after a deploy would otherwise pay for two hundred of them. onGetOfferBatch returns every fragment and every preview picture for up to twelve shades in one response; twelve separate responses gzip to 18,915 bytes over twelve round trips against 2,538 bytes over one, and onGetOfferImages is folded into it and deleted, so picking a shade in the sheet is one round trip rather than two. Offer ids are deduped, capped and intersected with the product''s own offers, since an id from another product would have rendered that product''s price and gallery into this page, and partial paths are capped and confined to the product card folder; the theme still owns which fragments a shade change redraws and there is no second copy of that map here. The batch inputs are deliberately not named product_id and offer_id, because each fragment partial resolves its own offer from input when one is present and all twelve would have rendered as the same shade. The ordered shade list is cached under the tag and key builder the rendered markup beside it already uses, plus a per request memo, since three call sites ask for it and reading a 230 entry list back costs 9.5ms; grouping it cost 91.4ms and happened on every one of those calls. Choosing which twelve shades to draw needs ids and families, not prices and pictures, so the OfferItems are built for the dozen that actually render and the row list work on a warm request drops from about 93ms to about 15ms. The sold out filter stays on the slow path on purpose, because hiding a shade needs its quantity and quantity moves with every order. Finally, Lovata''s popularity listener increments one product and clears the whole catalogue''s popularity sorting in the same closure, and this component''s page cycle re-runs on every AJAX postback the product page makes, so one visitor flipping through 230 shades dropped that sorted list once per interaction. A page render still fires the event; a postback counts the view without firing it, and on 673 active products the sorting now survives a postback that used to force a full re-sort. Every fix proven by reverting it and watching its own spec name the failure: 77 plugin tests, theme 79 unit and 151 end to end. Theme 2.5.14.'

2.0.27: 'One rule decides which offer a product card fragment renders, and a shade picked in the sheet no longer re-windows the page strip. Six fragment partials each resolved their own offer from request state and did not agree, which shipped a broken gallery. The product page URL is /p/slug/offer, the shade sheet writes a picked shade into the address bar so the state can be shared, and larajax posts to the current URL, so from the first sheet pick onward every fragment render arrived carrying an offer route param. The gallery partial re-resolved from that param and overwrote the offer the batch handler had just handed it, so the photograph stopped following the shade and froze on whatever the URL last named, while the heading started working at the same moment because it read the same param only to decide whether a shade had been chosen at all, and the price and the SKU never looked at the URL and never broke. Any visitor arriving on a shared shade link had the same frozen strip with no sheet involved. Classes\Helper\OfferRenderContext is now the only place that decision is made, registered as the Twig function offer_render_context. An offer the caller pinned wins and request state is not consulted; product_id and offer_id request input comes second, for the legacy per shade path and the quick view modal; and a plain page render resolves nothing at all, because the page already resolved its own offer once in onInit, so the route param only answers whether a shade was explicitly asked for. Pinning something that is not an OfferItem, or an OfferItem that is empty, throws rather than degrading into the page''s own shade, because that silent fallback was the bug. onGetOfferBatch passes obRenderOffer beside obOffer, deliberately a different name, because the page passes obOffer on a normal render too and that is not a shade the visitor chose. The batch also returns each shade''s own swatch circle, rendered from the strip''s own partial, so a shade picked in the sheet is grafted into the first slot of the strip instead of re-rendering it windowed around the pick. That window cost a round trip the visitor had not asked for, then twelve fresh shades whose fragments all had to be fetched again, and it minted one cached strip per shade anyone happened to pick. onGetSwatchStrip now answers per colour family only, its cache key loses the offer id, and one entry per family serves every visitor. The product offer count moves out of the per shade loop, since a value that cannot vary across a loop has no business inside it. Measured on product 366 with 230 active offers, read off the MySQL general log: a warm twelve shade batch renders 84 partials on 14 executed statements with nothing repeated per shade, and a sheet pick fires no strip request at all. Proven by stashing the whole fix, rebuilding the old bundle and watching five of six new specs fail while printing the real broken state; the sixth passed against the broken code and is labelled a smoke test rather than a proof. 86 plugin tests, theme 81 unit and 165 end to end. Theme 2.5.16.'

2.0.28: 'The offer-price import pipeline moves to Logingrupa.CustomXMLImportPricing. ExtendOfferImport is unsubscribed (file kept on disk until the Phase 3 cleanup release): PASS 1 metadata fixes and the discount field-list labels now live in ExtendOfferImportMetadata, and the discount steps (applyOfferDiscount, applyAuthorizedDiscount, applyRegularDiscount, updateDiscountSync) live in OfferDiscountImportSubscriber, subscribed to the new plugin''s after_vat/after_factor hooks. autoLinkProductTax moved into the new plugin, which reads the same XmlImportSettings keys - no settings key changed and no data migration exists, so the import output is byte-identical by the Phase 0 characterization goldens.'

2.0.29: 'A colour family switch is one request instead of two that have to queue. onGetSwatchStrip can now answer with the strip AND the twelve shades on it, behind a with_offers flag. Those two could never have been fetched in parallel, because nothing knows which twelve shades a family holds until its strip has been rendered, so the client asked for the strip, waited, read the ids out of the markup and asked again. On a phone that chain is the entire cost of switching colour, since there is no hover to start the first half early. The flag exists because the two callers want different things: a pointer resting on a chip wants the strip alone, which is a couple of kilobytes served out of CCache and shared between visitors, while a click or a tap is a commitment and wants everything at once. The shade rendering behind both handlers is now one method, renderOfferBatchList, called by onGetOfferBatch where the client names the shades and by onGetSwatchStrip where the strip itself names them, so a shade cannot describe itself differently depending on which request carried it. That batch is deliberately NOT cached and must not be: the gallery fragment draws the wishlist heart from this visitor own list and the add-to-cart fragment draws the login and approval gate from this visitor account, so a shared entry would hand one shopper another shopper wishlist and buy rights. The strip HTML keeps the shared cache it already had. getSwatchStripHtml takes the swatch data rather than resolving it a second time, and the unknown-family check moves up to the handler, where it was already being made. Measured with a real Chromium on product 366, 230 shades across 22 families: tapping a family fires 1 request against 2 before, and clearing the filter back to All fires 1 against 2, because the strip the server calls the head of the list shares none of its twelve with the window the page opened on. Theme 2.5.18.'
