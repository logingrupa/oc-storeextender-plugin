2.0.18:
  - 'Slug-keyed pagefinder types shop-product-slug and shop-promo-block-slug. The id-keyed shop-product type loads the whole ProductItem only to read its slug - 140 queries for the home page banners on a cold cache against 0 - and stores an id that differs between environments. Promo blocks had no pagefinder type at all.'
2.0.19: storeextender:verify-xml-import-settings asserts the 1C import config is complete and unambiguous on every site, and exits non-zero when it is not. Production was importing categories with the wildcard path "//Группа", which walks all 27 nodes in the feed instead of the 5 real roots, with no "children" field to recurse the tree and no mapping for preview_text, warning, ingredients or manufacturer. system_settings is excluded from data migrations because it carries gateway credentials, so the drift could not travel and nothing detected it; duplicate rows per site made the effective value undefined, since SettingModel reads with first() and no ORDER BY.
2.0.20: The promo tab renders an empty host for its rail paging arrows instead of leaving rail-nav.js to insert one. The module docks arrows into a section heading, and the tabs have none, so it created a row above the rail after the cards arrived over AJAX and pushed the whole tab down 40px on phones. That was the last measurable layout shift on the home page. findOrCreateRailTools already adopts an existing .hr-rail-tools, so an empty one in the markup plus a min-height in the theme means the arrows land in a box that was reserved from first paint. /lv/ now measures 0.0000 cumulative layout shift on throttled mobile, plain mobile and desktop.
2.0.21: 'Offer colour sync runs hourly, only writes when the export has actually changed, and can report its own drift. The colour-lab API now sends a global last_updated_at beside the version hash, so the command records both that timestamp and the time of its own import, and a new --status mode prints the two side by side and exits non-zero when they disagree, which makes it usable as a monitor. Twice a day left a real gap: the 2026-08-05 regrouping was exported at 09:49 UTC, minutes after the 09:00 run, and would have sat unseen until 13:00. Two things had to change for an hourly check to mean anything. The client cached its payload for an hour, so a scheduled run inside that window answered from cache and would have reported no change for up to an hour after a real one; the command now forces a network check, which still costs one 304 when nothing moved because If-None-Match is unchanged. And the sync state lived in the cache, where cache:clear on every deploy took it with it, so nothing could say what had already been imported; it now lives in system_parameters. That move needed care: the version stamp kept its old cache key, and a leftover entry would have shadowed the persisted value indefinitely, so the command would have compared against a stale stamp, decided it was already in sync and never recorded anything. getVersion reads the parameter directly and a test pins that a legacy cache entry cannot answer for it.'
2.0.22: 'Quote the 2.0.21 changelog entry so October can parse this file again, and add a test that keeps it parsable. Its prose contained a colon followed by a space, which is a syntax error in an unquoted YAML mapping value, and nothing about writing it failed loudly: the plugin still loaded and its code still ran, so the sync worked everywhere it was invoked by hand. VersionManager parses this file to decide what to migrate and what to record, so the real damage was silent. The nailscosmetics.no deploy died on october:migrate, and on the .lv site the deploy reported success while system_plugin_versions stayed at 2.0.20, one release behind the code actually running. The new test parses updates/version.yaml and asserts every key is a version number with a non empty note, and it was proven by restoring the unquoted line and watching it error.'

2.0.23: 'The offer colour sync can finish, console commands can read the XML import settings, and every logingrupa plugin''s changelog is now guarded. Three faults that only nailscosmetics.no exposed. The colour client had a 3 second timeout while the export''s cold path was measured at 11.1 seconds from that box, against a 0.26 second steady state, so every hourly run died with cURL error 28 and the site had never imported a single colour row; nothing in a request path holds that client any more, since the storefront reads the local table, so the budget now costs a cron run at worst rather than a page render. XmlImportSettings was missing from the site fallback list, and because that deployment keeps its only settings row on site 1 while the primary site is 2, a console command read null for the file list, every XPath and the whole field map, which left the 1C importer unable to run from CLI at all; it never showed on .lv, where site 1 is also the primary one. Both are pinned by tests that were proven by reverting the fix. The version file guard now covers all fifteen logingrupa plugins instead of this one, because october:migrate parses every one of them and a malformed line anywhere either kills a deploy or lets it report success while system_plugin_versions stops following the code.'
2.0.24: 'The offer sheet footer payload is trimmed, so a footer with nothing in it can collapse. The product page renders no call to action in the sheet any more, because a row tap already applies the shade there, and the theme hides an empty footer with :empty - which does not match an element holding a whitespace text node. renderPartial returns the template newline around the removed button, so without the trim the footer would still have drawn its top border and 26px of padding under the shade list on every phone. Theme 2.5.11.'
2.0.25: 'The product page swatch strip gets a server renderer, so the page can filter its own shade circles by colour family without opening the sheet. onGetSwatchStrip returns the same partial the page renders on load, either every shade of one family or the window of twelve around a given shade, and the theme swaps it in; selection is applied client side, which keeps the markup free of per visitor state and cacheable under the existing hr-sheet tag beside the sheet rows it already caches. The offer id rides that cache key, so it is validated against the product first: an id from anywhere else would have minted an unbounded number of entries all holding the same head window. The strip partial is split out of the theme so one file feeds page load, a shared ?family= URL and every later render, which retired the client side copy of the swatch markup that had drifted from it. getInlineSwatchData loses its inline limit argument in favour of INLINE_LIMIT and WINDOW_BEFORE, the cache key builder is shared with the row cache rather than repeated, five methods that no theme or plugin calls drop to protected, and a @method block documenting four methods the class actually declares is gone. Theme 2.5.12.'
2.0.26: 'The shade sheet stops shipping sixty three megabytes of pictures, a whole shade window arrives in one request instead of twelve, and a fragment redraw no longer throws the shop''s popularity sorting away. OfferImageHelper is now the only place an offer picture gets a size: 96px cropped for the 48px sheet row and the 45px strip circle, 600px fitted for the sheet''s preview slot, both webp at quality 80. The strip and the sheet deliberately share the swatch size, so the sheet''s rows come out of the browser cache the product page already filled. Three templates believed they were already asking for webp and were not, because File::getThumb takes three arguments and they passed four: PHP discards the fourth and getDefaultThumbOptions rewrites the third into a bare mode, so quality never arrived and the extension fell back to the source format, and every derivative shipped as a full quality PNG. On product 366, 230 active offers, the sheet cold open goes from 63,472 KB of pictures to 250.8 KB. storeextender:warm-offer-thumbs generates the set ahead of traffic in id order and chunks of 200, resumable with --from-id and capped with --limit, because October writes a thumbnail inline on the first request that asks for it and the first visitor after a deploy would otherwise pay for two hundred of them. onGetOfferBatch returns every fragment and every preview picture for up to twelve shades in one response; twelve separate responses gzip to 18,915 bytes over twelve round trips against 2,538 bytes over one, and onGetOfferImages is folded into it and deleted, so picking a shade in the sheet is one round trip rather than two. Offer ids are deduped, capped and intersected with the product''s own offers, since an id from another product would have rendered that product''s price and gallery into this page, and partial paths are capped and confined to the product card folder; the theme still owns which fragments a shade change redraws and there is no second copy of that map here. The batch inputs are deliberately not named product_id and offer_id, because each fragment partial resolves its own offer from input when one is present and all twelve would have rendered as the same shade. The ordered shade list is cached under the tag and key builder the rendered markup beside it already uses, plus a per request memo, since three call sites ask for it and reading a 230 entry list back costs 9.5ms; grouping it cost 91.4ms and happened on every one of those calls. Choosing which twelve shades to draw needs ids and families, not prices and pictures, so the OfferItems are built for the dozen that actually render and the row list work on a warm request drops from about 93ms to about 15ms. The sold out filter stays on the slow path on purpose, because hiding a shade needs its quantity and quantity moves with every order. Finally, Lovata''s popularity listener increments one product and clears the whole catalogue''s popularity sorting in the same closure, and this component''s page cycle re-runs on every AJAX postback the product page makes, so one visitor flipping through 230 shades dropped that sorted list once per interaction. A page render still fires the event; a postback counts the view without firing it, and on 673 active products the sorting now survives a postback that used to force a full re-sort. Every fix proven by reverting it and watching its own spec name the failure: 77 plugin tests, theme 79 unit and 151 end to end. Theme 2.5.14.'

2.0.27: 'One rule decides which offer a product card fragment renders, and a shade picked in the sheet no longer re-windows the page strip. Six fragment partials each resolved their own offer from request state and did not agree, which shipped a broken gallery. The product page URL is /p/slug/offer, the shade sheet writes a picked shade into the address bar so the state can be shared, and larajax posts to the current URL, so from the first sheet pick onward every fragment render arrived carrying an offer route param. The gallery partial re-resolved from that param and overwrote the offer the batch handler had just handed it, so the photograph stopped following the shade and froze on whatever the URL last named, while the heading started working at the same moment because it read the same param only to decide whether a shade had been chosen at all, and the price and the SKU never looked at the URL and never broke. Any visitor arriving on a shared shade link had the same frozen strip with no sheet involved. Classes\Helper\OfferRenderContext is now the only place that decision is made, registered as the Twig function offer_render_context. An offer the caller pinned wins and request state is not consulted; product_id and offer_id request input comes second, for the legacy per shade path and the quick view modal; and a plain page render resolves nothing at all, because the page already resolved its own offer once in onInit, so the route param only answers whether a shade was explicitly asked for. Pinning something that is not an OfferItem, or an OfferItem that is empty, throws rather than degrading into the page''s own shade, because that silent fallback was the bug. onGetOfferBatch passes obRenderOffer beside obOffer, deliberately a different name, because the page passes obOffer on a normal render too and that is not a shade the visitor chose. The batch also returns each shade''s own swatch circle, rendered from the strip''s own partial, so a shade picked in the sheet is grafted into the first slot of the strip instead of re-rendering it windowed around the pick. That window cost a round trip the visitor had not asked for, then twelve fresh shades whose fragments all had to be fetched again, and it minted one cached strip per shade anyone happened to pick. onGetSwatchStrip now answers per colour family only, its cache key loses the offer id, and one entry per family serves every visitor. The product offer count moves out of the per shade loop, since a value that cannot vary across a loop has no business inside it. Measured on product 366 with 230 active offers, read off the MySQL general log: a warm twelve shade batch renders 84 partials on 14 executed statements with nothing repeated per shade, and a sheet pick fires no strip request at all. Proven by stashing the whole fix, rebuilding the old bundle and watching five of six new specs fail while printing the real broken state; the sixth passed against the broken code and is labelled a smoke test rather than a proof. 86 plugin tests, theme 81 unit and 165 end to end. Theme 2.5.16.'

2.0.28: 'The offer-price import pipeline moves to Logingrupa.CustomXMLImportPricing. ExtendOfferImport is unsubscribed (file kept on disk until the Phase 3 cleanup release): PASS 1 metadata fixes and the discount field-list labels now live in ExtendOfferImportMetadata, and the discount steps (applyOfferDiscount, applyAuthorizedDiscount, applyRegularDiscount, updateDiscountSync) live in OfferDiscountImportSubscriber, subscribed to the new plugin''s after_vat/after_factor hooks. autoLinkProductTax moved into the new plugin, which reads the same XmlImportSettings keys - no settings key changed and no data migration exists, so the import output is byte-identical by the Phase 0 characterization goldens.'

2.0.29: 'A colour family switch is one request instead of two that have to queue. onGetSwatchStrip can now answer with the strip AND the twelve shades on it, behind a with_offers flag. Those two could never have been fetched in parallel, because nothing knows which twelve shades a family holds until its strip has been rendered, so the client asked for the strip, waited, read the ids out of the markup and asked again. On a phone that chain is the entire cost of switching colour, since there is no hover to start the first half early. The flag exists because the two callers want different things: a pointer resting on a chip wants the strip alone, which is a couple of kilobytes served out of CCache and shared between visitors, while a click or a tap is a commitment and wants everything at once. The shade rendering behind both handlers is now one method, renderOfferBatchList, called by onGetOfferBatch where the client names the shades and by onGetSwatchStrip where the strip itself names them, so a shade cannot describe itself differently depending on which request carried it. That batch is deliberately NOT cached and must not be: the gallery fragment draws the wishlist heart from this visitor own list and the add-to-cart fragment draws the login and approval gate from this visitor account, so a shared entry would hand one shopper another shopper wishlist and buy rights. The strip HTML keeps the shared cache it already had. getSwatchStripHtml takes the swatch data rather than resolving it a second time, and the unknown-family check moves up to the handler, where it was already being made. Measured with a real Chromium on product 366, 230 shades across 22 families: tapping a family fires 1 request against 2 before, and clearing the filter back to All fires 1 against 2, because the strip the server calls the head of the list shares none of its twelve with the window the page opened on. Theme 2.5.18.'
2.0.30: 'Remove the retired offer-price pipeline and its characterization suite - ownership moved to Logingrupa.CustomXMLImportPricing'
2.0.31: 'Family switch batch capped to the 12-shade window (a 44-shade family evicted the client cache and re-fetched everything), hero derivative moves into OfferImageHelper (offer_hero_src) and warm-offer-thumbs pre-generates it, canonical product URL selects the strip''s first shade instead of the cheapest, and the sheet image list dedupes the preview photograph the import re-attaches as a gallery entry.'
2.0.32: 'Add to cart tells the truth, and a broken cart cookie heals itself. Two faults stacked into one symptom - a success toast over an empty cart. The cart cookie is the sole identity of a guest cart, set at path=/; a browser also holding a stale same-name cookie at a longer path (an old release, an old APP_KEY era) sends that one first per RFC 6265, PHP takes the first occurrence, CartProcessor fails to use it and silently mints a brand-new cart on every request: the add succeeds into its own throwaway cart while the header badge and the sidebar read a different fresh empty one, and the fresh path=/ cookie can never displace the shadow, so the browser never recovers on its own. ClearShadowCartCookie, registered on the frontend controller, expires the cookie at every ancestor directory path of the request URL whenever the raw Cookie header carries the name twice or carries a value the application cannot use - checked before the app runs, so the heal rides the same response and the very first add lands. Independently, the stock Cart::onAdd discards every per-position result and answers status true even when nothing was added: a cleared quantity spinner submits an empty string and empty() swallows it as a silent no-op behind a green toast, and the one e2e test asserting payload status could never catch any of it. Cart::onAdd is now intercepted through the same cms.ajax.beforeRunHandler map this handler already uses: the payload is coerced to integers and rejected loudly when a row cannot become a position, the same CartProcessor performs the add, and success is then PROVED by finding every requested offer among the cart positions. A failed add deliberately carries no message, because clients show their own translated error and a server string would surface in English. Lovata code untouched. Theme 2.5.23 verifies on the client side and paints the badge from the same response.'
2.0.33:
  - 'Color Family becomes a real Shopaholic property. storeextender:sync-offer-colors now also projects the color-lab family taxonomy (families.json) onto a color_family select property: one PropertyValue per family with the Latvian display name as the base value and en/ru as translations, the value slug pinned to the stable family slug through the shopaholic.property.generate_value event so a display-name rename never moves URLs or filter cache keys, and one PropertyValueLink per mapped offer written through the models so the filter caches invalidate themselves. The companion table logingrupa_storeextender_color_family_meta carries each family''s slug, hex and localized names plus synonyms, which also feeds ColorFamilyMatcher - the query-to-family matcher the search chips build on. The property''s external_id stays NULL, so the 1C import guard leaves it invisible to property matching, and an empty families payload warns and skips rather than deleting anything.'
  - create_table_color_family_meta.php

2.0.34: 'The ?color= catalog filter and the search chips speak in shades. color_family_offer_filter (Twig) returns the offer ids behind a family slug - the same FilterValueStore lookup, Offer::class result bucket - so the catalog renders each matching shade as its own card instead of intersecting the product list, and color_family_chips counts those offers rather than the products that own them: a chip reading Sarkans (57) promises 57 red shades, which no longer disagrees with a product page whose own sheet counts 19 of them on one product. Both filter functions share one guarded lookup with the same fail-safe contract - null when the property or FilterShopaholic is missing (render unfiltered), an empty array when the slug is real but matches nothing. search_offer_filter feeds the same grid for text queries: the configured offer search fields alone matched 3 offers for gel while product search matched pages of products, so the function unions direct offer matches with every offer of a matching product, and the caller intersects with the active offer list.'

2.0.35: 'Every funnel event reports margin, with the VAT step the Purchase-only rule was missing. The owner formula (2026-08-15): the buyer price carries VAT, the izpl cost (price type 3) is stored without it, so value = gross / (1 + tax percent / 100) minus izpl, per unit, times quantity. PurchaseMarginValueHandler grows into MarginValueHandler covering Purchase, ViewContent, AddToCart and InitiateCheckout on the same before_dispatch hook: Purchase reads the order positions and the tax_percent stamped on each at order time, the other events read the payload the Metapixel adapters built (contents rows, else the single content_ids offer priced by value), resolving VAT through the product tax link with the global tax as fallback. contents keeps real sales prices for catalog match, event_id and event_time stay untouched, and any anomaly - foreign content id shape, no resolvable izpl at all - leaves the payload untouched because a full-revenue event beats a fabricated margin. Example on order 34908: 16.90 gross at 21 percent minus 5.12 cost now sends 8.85 where the VAT-less rule sent 11.78. The browser twins go through the new metapixel.pixel.before_render hook (Logingrupa.Metapixel 2.0.2 - ship together): before_dispatch runs in the CAPI queue job and never sees the custom_data a request-time fbq block renders, so without the second listener the browser said 6.98 while the server said 1.79 on the same event_id and Meta kept the browser number. Purchase is skipped on the pixel hook because its browser twin renders the frozen EventLog payload that already carries the mutation - running the math twice would deduct VAT and cost twice.'

2.0.36: 'The search sheet can offer every color family, not only the ones a query names. color_family_list (Twig) returns all synced families as chips - same slug, localized name, hex, shade count and ?color= URL shape as color_family_chips, same zero-count rule, minus the query matching - so the theme renders an all-family pill row on an empty query and appends the unmatched families after the matched chip on a color query. ColorFamilyMatcher grows families(), the matcher-less counterpart of match(): both now resolve display names through one shared rule (requested locale, else the default locale, else the raw family name), and the chip rendering itself - the filter-store count and the catalog URL - collapses into one builder both Twig functions call, so a family cannot count its shades differently depending on which function drew it.'

2.0.37: 'A locale the families export does not carry reads English before Latvian. The .no storefront runs a locale (nb-no) outside the names map the color-lab export ships (en, lv, ru), so every pill and chip fell through to the Latvian default - on a store whose shoppers include Ukrainians reading neither. resolveEntries now tries the requested locale, then English, then the Latvian default, then the raw family slug. Matching was never locale-bound - the term index has always contained every locale''s names and synonyms, so typing red or krasnyj on any store already matched - only the display name moved.'

2.0.38:
  - 'Confidence decides the color order, on both axes. The pill and chip order obeys the families.json export instead of an accident of history: the sync upserts meta rows by slug, so row ids never move after the first import and the matcher''s plain get() froze the very first export''s insertion order forever - the color-lab could reorder its taxonomy (now by average classification confidence, colorclassifier 1.5.0) and no storefront would ever notice. sort_order persists each family''s position in the export map on every sync run, and the matcher''s index query orders by it with NULL positions and a missing column falling back to id order, so undeployed migrations, pre-contract rows and a dormant sync all keep exactly the old behavior; order changes rotate the matcher''s content-stamp cache through the updated_at bump the position write causes. Inside a family the same signal orders the shades: offers.json now carries each offer''s own confidence, the sync stores it on the offer color row, and color_family_offer_filter returns the ?color= grid''s offer ids highest-confidence first (the most certainly-red reds open the red page), unscored shades sinking to the tail in their old order - the theme applies the list with applySorting so the order survives the active-list intersect (theme 2.5.29). Every miss - column not migrated, no scores synced, export without the field - keeps the exact pre-contract behavior.'
  - update_table_color_family_meta_add_sort_order.php
  - update_table_offer_colors_add_confidence.php

2.0.39: 'The pill filter moves to the browser, the vocabulary ships with the chips. Every chip from color_family_list / color_family_chips now carries terms - the family''s full match vocabulary, space-joined: names and synonyms in every locale, both raw lowercase (so a Cyrillic query typed in the storefront can meet красный - JS cannot transliterate) and the transliterated form the server matcher compares against. The theme renders it as data-terms and filters the pill row per keystroke with no round trip (theme 2.5.32); match() semantics are untouched because the normalized query can never collide with the added raw-alphabet terms.'

2.0.40: 'The server-side chip matching dies with its last caller, and the chips stop promising shades the grid will not draw. Theme 2.5.32 moved the family pill filtering into the browser, which left color_family_chips with zero call sites, so that Twig function, ColorFamilyHelper::chips() and the matcher''s whole query side (match, matchAgainstIndex, QUERY_MIN_LENGTH) are deleted along with the unit tests that pinned the server-side matching rule; normalizeTerm stays, because buildIndex still normalizes the vocabulary the client filter ships. color_family_filter goes too - the product-id variant was never consumed by any theme revision. Chip counts now intersect each family''s offer ids with the active offer list, read once per build, because the catalog grid intersects with active offers before drawing: a chip could count inactive shades it would never render, and a family whose offers were all inactive survived the zero-count drop; the drop now runs after the intersect, and a pure assembleChipList seam pins both rules in unit tests. The family index cache key gains an INDEX_VERSION beside the content stamp, since a key derived only from max(updated_at) and row count kept serving the pre-deploy index shape for up to an hour after a code change to buildIndex. SearchOfferHelper gets its first tests - empty, whitespace and non-string queries answer an empty list, an unconfigured or unmatched search answers an empty list rather than everything, and the union of direct offer matches with the offers of matching products deduplicates and returns ints, run against the real Lovata search plumbing on SQLite stubs. Its docblock also stops promising an ordering the consumer cannot see: the theme applies the list via intersect(), which keeps the collection''s own order, so order is now explicitly not part of the contract. Housekeeping: runtime call sites read the offer-color and family-meta table names from their models instead of hardcoding them (migrations keep their frozen names by design), the confidence-column introspection is memoized per request and sync-offer-colors resolves its column flag once per run, and isUpToDate documents the trap that the export version stamp does not rotate when the payload gains a field, so a migration that adds a column needs one --force backfill.'

2.0.41: 'GoodsReceived Settings joins the per-site settings fallback. A console command resolves the PRIMARY site, which on nailscosmetics.no is the disabled Latvian source site, so goodsreceived:recompute_active_from_stock read a partial settings row there and saw auto_deactivate_on_zero as false. Note the fallback only fires when getSettingsRecord() returns null, so this entry is inert until that partial row is deleted. The model list is now guarded with class_exists, because Logingrupa.GoodsReceivedShopaholic is in neither the composer require nor the plugin require of this plugin and a deployment without it would otherwise fatal on boot.'

2.0.42: 'Review cleanup on the color helpers. ColorFamilyHelper::filterIds drops the result-model parameter both callers pinned to Offer, and three docblocks stop describing a per-keystroke chip build the browser has done since 2.0.39. SearchOfferHelper gets the test that pins its inactive-offer contract - the union leg returns inactive offers for the caller to intersect, the direct leg does not - and the integration test binds TranslatableSearchHelper so it resolves the same helper production does.'
2.0.43:
  - 'Satellite cache invalidation handler: Price, PropertyValueLink, File and SeoParam rows clear their owner Product/Offer/Category item cache from their own save/delete events, pairing with the toolbox unchanged-save guard so the nightly import stops wiping caches for unchanged models while price, property, image and SEO changes still invalidate. The price guard compares numerically because the old_price mutator rewrites stored 0.00 as int 0 on every save. Also eager loads seo_container on Product and Category items (58 per-model SEO queries batched on cold builds) and reworks the color family index cache to a fixed key with explicit forgetIndex() after sync.'
2.0.44:
  - 'Order property snapshot no longer stores checkout passwords in plain text: MakeOrder merged the whole user_data array into Order::$property, so guests registering at checkout had their raw password written to the orders table since 2020 (4369 rows on .lv, 26 on .no). OrderPropertySecretHandler strips password and password_confirmation on model.beforeSave, and storeextender:purge-order-property-secrets cleans the history with a chunked JSON_REMOVE (--dry-run available). Account logins were never affected, stored user passwords are bcrypt.'
  - 'The guard rewrites the raw attribute via getAttributes/setRawAttributes: Toolbox SetPropertyAttributeTrait MERGES on assignment, so $obOrder->property = $arProperty can add a key but never remove one.'

2.0.45:
  - 'RainLab.User gains the four Buddies columns that have no equivalent there: phone, phone_short, property and viewed_products. The checkout POST field names are a frozen contract, and property carries the B2B invoicing payload 12590 of 13820 users hold, so it stays a JSON column rather than a pivot that would cost a query per logged in page. viewed_products has no reader in the current theme and is carried over so its history survives until a replacement feature lands. Both migrations no-op unless RainLab.User is installed.'
  - 'price_type_id lands on user_groups. update_table_user_group_1 names users_groups on its RainLab branch, which is the membership pivot rather than the group table, and it has already run so it cannot correct itself.'
  - update_table_users_add_buddies_columns.php
  - update_table_user_groups_add_price_type_id.php

2.0.46:
  - 'The store stops depending on Lovata.Buddies specifically and asks Toolbox UserHelper which user plugin is live. ActivePriceHelper, ExtendUserController, ExtendUserGroupModel, ExtendMenuHandler and the Groups controller all resolve the model, controller and backend menu at runtime, so user group pricing and the group screen behave the same under Buddies and under RainLab.User. New UserGroupHelper is the single seam for the group model, which UserHelper does not cover.'
  - 'RainLab.User has no dynamic user properties, so this plugin supplies them: a UserProperty model on Toolbox CommonProperty, its own backend screen, and a handler that renders the active definitions on the user form. Buddies ships the same feature, so the handler and the menu entry stand down while Buddies is the live plugin and the two never render twice.'
  - 'ExtendRainLabUserModel gives the RainLab user the surface the store already writes to: phone with its derived phone_short, phone_list, property with Buddies merge semantics rather than replace, and name as an alias onto first_name. The alias exists because checkout POST field names are copied verbatim into the order property snapshot and 35224 historical orders read back name and last_name on the printed invoice.'
  - 'Two long-standing defects: update_table_user_group_1 named the membership pivot rather than the group table on its RainLab branch, and attachUserToGroup called sync() under a comment promising it would not detach, which dropped every group the handler did not name. The group column now lands through its own migration because the original has already run.'
  - 'addValidationRules only writes customMessages when the model declares it. October\Rain\Auth\Models\User does; RainLab User extends the plain Model and does not, where the assignment would have gone to setAttribute and tried to save a customMessages column.'
  - create_table_user_properties.php

2.0.47:
  - 'storeextender:migrate-buddies-users ports Lovata.Buddies accounts onto RainLab.User: users, groups, memberships, dynamic property definitions and password hashes, with the original ids preserved. Ten tables carry Buddies user ids with no foreign key to protect them, so a renumbering would silently detach orders, carts and wish lists. The command is idempotent, takes --dry-run and --verify-only, and exits non zero when a checksum disagrees.'
  - 'Set based SQL rather than model saves: RainLab beforeCreate would overwrite primary_group_id, its validation would reject rows the shop has carried for years, and 13821 model saves cost minutes where one statement costs seconds. persist_code is nulled because Buddies hashes it and RainLab does not, so every user re-establishes their session at next login. is_activated is folded into activated_at, which RainLab exposes as an accessor rather than a column; without the created_at fallback five activated users would have been unable to log in.'
  - 'RainLab seeds user_groups with guest at id 1 and registered at id 2, the ids Buddies uses for authorized and salona. Group ids drive price_type_id and therefore user group pricing, so the Buddies ids win and the seeded rows move above the Buddies range. Their codes are untouched, so getGuestGroup() and getRegisteredGroup() still resolve.'
  - 'BuddiesUserChecksum compares source and target column by column with BIT_XOR over the top 64 bits of SHA2. CRC32 was the first choice and is unusable here: it is linear over GF(2), so BIT_XOR over equal length inputs collapses to a checksum of the XOR of the raw bytes, and three property columns produced an identical digest because their values are permutations of the digits 1 to 9.'

2.0.48:
  - 'UserModelHandler asks Toolbox UserHelper which user plugin is live instead of PluginManager::hasPlugin(). hasPlugin ignores the disabled flag, so a disabled Buddies left the handler still extending the Buddies model and never wiring ExtendRainLabUserModel, while every other seam had already switched. UserHelper resolves through PluginManager::exists(), which honours it.'
  - 'ExtendRainLabUserModel relaxes the first_name rule to nullable. RainLab declares it required and 3147 of the 13821 ported accounts carry no name, so left alone every one of them would fail validation on any save: profile edit, checkout phone update, backend save. Buddies never required a name, and this keeps the pre-migration contract.'
  - 'ThemeUserBinder gives the five theme layouts one call for "which session component is live, and who is the user". Buddies exposes the current user through UserData and logs out through Logout::onAjax, RainLab through Session and Session::onLogout; neither class exists when the other plugin is live, so each layout carried its own copy of the check.'
  - 'OrderUserPhoneHandler writes the checkout phone onto the customer account, overwriting rather than appending. MakeOrder gates its own phone handling on Lovata.Buddies, so under RainLab an existing customer phone was never updated at all, and the Buddies branch appended to a comma delimited list, which is how accounts ended up holding four variants of one number. It listens on shopaholic.order.before_create, which fires with halt enabled, so it never returns a value. A failing user save is logged and swallowed: a phone update must not roll back a paid order.'

2.0.49:
  - 'RainLabUserHelperFix replaces Toolbox RainLabUserHelper::findUserByEmail(), which calls RainLab\User\Models\User::findByEmail() - a method RainLab.User 3.5.3 does not define. MakeOrder resolves the customer through it on every checkout, so ordering failed outright with "Call to undefined method" until this was bound over it. Guests are excluded from the lookup to match Buddies, which had no guest account concept, so an order can never attach to one.'
  - 'RainLabRegistrationHandler creates the account for RainLab registration component. Its own createNewUser() hard codes a four field whitelist and requires first_name, so the shop register form - which posts neither name, and does post phone and property[...] - failed on the missing name and dropped the B2B payload and the school code that decides the price group. rainlab.user.beforeRegister is the documented seam for replacing it. Email, username and the password policy are left to the model rules rather than re-validated.'
  - 'The property[security] register question moves off the model rules under RainLab. RainLab User cannot carry customMessages, so the rule fired with an untranslated message, and being a model rule it also blocked backend and programmatic user creation. It is an anti-bot question on one form, so it is validated in the registration handler with the existing lang strings. Buddies keeps the model rule.'
  - 'UserPhoneCheck answers whether a phone number already belongs to an account, so the checkout form can offer a login instead of a duplicate registration. The response is a bare boolean and the endpoint is rate limited per address: anything richer, or unlimited, turns a public form into a phone number lookup service. Matching runs on phone_short with FIND_IN_SET, because migrated accounts carry several variants of one number in that column.'
  - 'The migration command now asks before rewriting rows that already exist. A first run only inserts; a second run after go-live would push every ported row back to its Buddies values and discard real activity - last_seen above all, plus any phone, property or name changed since. --force skips the prompt. Verify right after the port: last_seen starts drifting the moment anyone logs in.'

2.0.50:
  - 'Assigning an empty array to property on the RainLab user no longer wipes the stored keys. The merge listener returned null for an empty value, and on model.beforeSetAttribute null means "proceed with the original", so property = [] emptied the column where the Toolbox trait ignores the assignment. It now answers the stored set. No production path posts an empty property today; the test suite below is what surfaced it.'
  - 'The migration seam gets its test suite: 47 tests across the porter, the checksum, RainLabUserHelperFix, RainLabRegistrationHandler, OrderUserPhoneHandler, UserPhoneLookup, UserPhoneCheck, ThemeUserBinder, the group and property helpers, and ExtendRainLabUserModel - all through the real plugin boot, so a handler that stops being wired fails loudly. The porter and checksum are MySQL-only SQL and run in BuddiesUserPortMysqlTest against a scratch database named by STOREEXTENDER_MYSQL_TEST_DB, skipping with a clear message when unset; the checksum swap-detection test uses equal length permuted values, the exact shape the discarded CRC32 digest could not see.'

2.0.51:
  - 'Cold-cache category N+1 round. property_set joins CategoryItem::$arQueryWith so 27 categories cost one set_category_link read instead of 26, guarded by hasPlugin(Lovata.PropertiesShopaholic) because an unknown relation path in $arQueryWith throws RelationNotFoundException. PrimeCategoryTreeHandler hydrates the whole active category tree once on cms.page.beforeDisplay, where the header menu used to reach CategoryItems through ten hydration events at five queries each. Category saves and deletes clear the per-request active-children map that the root repo patches into shopaholic CategoryItem (patches/lovata-shopaholic-category-children-map.patch); without the reset a backend save or XML import would keep reading a map primed before its writes. Product page cold: 157 queries to 68, home 99. Ships only with the root repo patch registration.'
  - 'CartStateReader answers the header badge count and the cart-state offer map on any non-POST request from one indexed cart_positions read. It resolves the cart the way CartProcessor::init() does - user cart first, then the shopaholic_cart_id cookie, honouring CartProcessor::$iTestCartID - but never creates a cart row and never runs the position, shipping and promo build. Theme 2.5.46 widens bSkipCartBuild from cookieless guests to every non-POST request and reads arCartState from the layout; the cart and checkout pages keep their own full Cart.get() build. A logged-in user whose guest cart has not merged yet reads the user cart, or the guest cookie cart when no user cart exists - the merge itself still happens on the next POST, exactly as before for reads. Product page cold with a cart cookie: 198 queries to 69, warm 26 to 20, rendered HTML byte-identical on product, home, cart and checkout. The theme change and this class must deploy together.'

2.0.52:
  - 'OfferSheet cart marks read through CartStateReader::getOfferIdList() - one indexed cart_positions query - instead of CartProcessor::instance()->get(). The sheet handlers are POSTs, so they sat outside the 2.0.51 bSkipCartBuild gate, and answering "which offer ids are in the cart" ran the full position build plus the entire campaign promo pass: every campaign x six relation-list stores, tax resolution and a cold OfferItem hydration per cart position, none of it rendered. The auto-fired sheet preload on a cold product page: 160 queries to 12. In-cart rings are unchanged - the id list is applied client-side, and the row HTML was already cart-agnostic.'

2.0.53:
  - 'Validation messages name the user fields in the shopper''s language on every site. RainLab''s model rules and the password reset validator both ran with raw column names, so a register form read "password apstiprinājums nesakrīt" and "email ir jau aizņemts", and the reset page the same. lang/<locale>/validation.php now ships validation.attributes for email, password, password_confirmation, first_name, last_name, username and phone in lv, ru, de, lt and nb-no, and boot() registers the plugin lang dir as a translation loader path, because a plugin namespace cannot override the core validation group while a loader path merges over it. The Latvian and Lithuanian password names are genitive because those core strings read ":attribute apstiprinājums nesakrīt" and "Atributo :attribute patvirtinimas neatininka".'

2.0.54:
  - 'The password recovery mail speaks the shop language. RainLab ships one English view for user:recover_password, and October only looks for a locale variant beside the registered view, so the plugin now registers the template against its own views/mail/recover_password.htm with lv, ru, de, lt and nb-no variants next to it. Registrations merge left to right and this plugin already sorts 34 places after RainLab.User on its existing $require chain, so it wins the code; RainLab.User is deliberately not added to $require, because both production sites still run Lovata.Buddies and a missing requirement would disable the whole plugin. A DB row with that code would take precedence and would not be localized; no site has one.'
  - update_table_system_mail_unescape_newlines.php
  - 'Repairs every mail record the v1 to v2 data import stored with the literal two character sequences \r and \n in place of line breaks: the header partial, both order templates, the salon lead, the backend lead and the FormBuilder default. The header sits in the mail layout, so every message the shop sent opened with a column of visible \r\n above the greeting, and the order templates carried the same damage through their own markup. Local and the .lv server hold the damage, .no does not; v1 itself is clean, which is what dates it to the import. The migration walks partials, templates and layouts, so it is a no-op on a healthy database.'
  - 'The order mails get their body back. create_order_user and create_order_manager call the product, orderSummary and buttons partials, and the import brought over neither, so October rendered "Missing partial" comments where eighteen line items, the totals block and the proforma links belong: a customer confirmation was 20KB of headers and bank details with no products in it. All three now ship as files next to bankdetails, taken from the v1 database, and registerMailPartials names them. A rendered confirmation for order 260902-0001 goes from 20,523 to 364,916 bytes with every offer name, thumbnail and price in place.'

2.0.55:
  - update_table_system_mail_layout_footer.php
  - 'The mail footer stops signing off as October CMS in English. The footer line lives in the default mail layout, a database row seeded once at install, so it kept October''s stock sentence on every locale: the migration swaps the hardcoded "All rights reserved." for a trans() call, which the mailer Twig environment exposes and MailManager resolves inside withLocale(), and lang/<locale>/lang.php carries mail.rights_reserved in lv, ru, de, lt and nb-no. The name itself is {{ appName }} from APP_NAME - both production servers already read "NAILS cosmetics", only the local .env still held October''s default, and .env.example now matches the servers.'

2.0.56:
  - 'The chosen school is the user''s group of record, so it also becomes RainLab''s primary group - the one the backend user preview shows. Three seams enforce it: UserModelHandler::makeSchoolGroupPrimary on afterCreate/afterSave (quiet query so afterSave does not re-fire, RainLab branch only) covers registration and later school changes; BuddiesUserPorter::promoteSchoolPrimaryGroups runs as the port''s last step (JSON_VALID-guarded, collation-converted, seeded codes excluded) so the cutover ports every user with the right primary; users without a school keep the seeded registered group. The school dropdown query is centralized in UserGroupHelper::getSchoolGroupList (id >= 5 and code not guest/registered) because the auth pages'' bare id > 4 started catching the relocated seeded groups.'
  - 'One group editor per user plugin in the backend menu. Under RainLab the stock User Groups page is the survivor (ExtendUserGroupController already injects the price type field there), so ExtendMenuHandler adds the plugin''s own Groups item only under Buddies and leaves RainLab''s usergroups entry alone. The Groups controller stays URL-reachable for the Buddies branch until Buddies is removed.'
  - 'A registration that posts no redirect target lands on the fresh account''s own profile page instead of the home page, via a rainlab.user.register listener whose non-null return becomes the response; an explicit redirect keeps winning through the component''s own redirectIntendedFromPost. Registration also stamps created_ip_address and last_ip_address - RainLab ships the columns and touchIpAddress() but never calls it - and UserIpAddressHandler refreshes last_ip_address on every rainlab.user.login.'

2.0.57:
  - 'C6 - the Buddies seams come out. ThemeUserBinder, UserGroupHelper, UserPropertyHelper, ExtendMenuHandler, UserModelHandler, ExtendUserController, ExtendUserPropertyFieldHandler, RainLabRegistrationHandler and the UserProperties controller lose their Lovata.Buddies branches and stand-down guards; the Buddies-only Groups backend controller and its views are deleted (the stock RainLab User Groups page with the injected price type field is the editor). RainLab.User joins $require now that every site runs it, which also pins this plugin sorting after RainLab so the user:recover_password registration keeps winning. BuddiesUserPorter, BuddiesUserChecksum and storeextender:migrate-buddies-users stay: they read the lovata_buddies_* tables as raw SQL and those tables remain the staging area for the v1 sync on new.nailscosmetics.lv.'
  - 'The porter propagates membership revocations on a re-sync. portMemberships only upserted the source set, so a users_groups row the source dropped between syncs survived on the target forever and the memberships checksum went red without a repair path - 16 such rows on local, all real v1 revocations (mostly salona price group). A scoped DELETE now removes target-only pairs for users the source knows and leaves native accounts above the ported range alone; the preflight message no longer claims the Buddies PLUGIN must be installed, only the staging tables.'
2.0.58:
  - 'Category order follows the 1C name prefixes. Lovata orders siblings by nested-set position, which is the physical node order of import.xml, while 1C names carry A/B/C and 1/2/3 prefixes in the code column. CategorySorter sorts every sibling group by code (natural, case-insensitive), uncoded siblings keep their relative order after the coded ones, then clears the CategoryItem caches and the top-level list. It runs once per process after a category import via the Toolbox afterImport event and on demand through storeextender:sort_categories. Ported from an uncommitted legacy v1 change.'
2.0.59:
  - 'An old price equal to the price is stored as 0. The 1C feed never carries an old price and Shopaholic keeps whatever the column already holds, so after the cutover the base price rows restored from lv2 kept a stale old price that the import then matched, and every product page rendered the same number struck through. EqualOldPriceHandler zeroes an equal old price on every Price save, so the theme old_price_value > 0 checks stay true only for a real discount. Integration test covers equal, higher, zero and update paths.'
2.0.60:
  - 'CategorySorter refuses to reparent. After every sibling move it reloads the node and throws if the parent changed, so a broken nested set stops the run instead of drifting silently. Integration test covers root and child sorting, idempotence and the parent invariant. On the new .lv box Komplekti and Vaksacija had ended up under Manikirs and Skropstas after two overlapping imports; both were moved back to root by hand on 2026-09-04 and the active tree matches legacy again.'
2.0.61:
  - 'AJAX errors stop echoing SQL. Larajax builds the AJAX envelope from the raw exception message with no debug check, so a failed query handed its SQLSTATE text and SQL to the browser even with APP_DEBUG=false; the 2026-08-26 injection on the legacy box fed on exactly this class of leak. SafeAjaxResponse is bound through Larajax registerCustomResponse and routes every exception not written for the user (query errors, generic exceptions, HTTP errors 500 and up) through the October error policy, which stays generic in production. ApplicationException, validation, not-found and Larajax AJAX exceptions keep their messages. Integration test covers debug off, debug on, and the user-facing survivors.'
2.0.62:
  - 'SafeAjaxResponse keeps the Larajax severity and status and only replaces the message. 2.0.61 turned every plain exception, ForbiddenException and NotFoundException into a fatal 500, so backend permission denials and RainLab User guards popped a browser alert and counted as server errors; now the shape is whatever Larajax produced and only text of non-user-facing exceptions goes through the October error policy. Exceptions wrapped by Twig during partial rendering are classified by their cause, so an ApplicationException thrown inside a search partial still reaches the shopper. Test covers query and generic exceptions, debug on, ApplicationException, ForbiddenException, validation and Twig-wrapped causes.'
2.0.63:
  - 'Banner artwork follows the shopper''s language on its own. LocalizedMediaHelper, registered as the Twig filter localized_media, swaps the locale suffix in a media path ("...-lv.jpg" to "-ru.jpg") whenever that file is in the library, and keeps the stored path when it is not. The theme used to gate the swap on a per-banner checkbox list the editor kept by hand: the option list had collapsed to a single entry because it keyed sites by the first two characters of their code (lv_LV, lv_EN and lv_RU all read "lv"), so saved banners claimed Latvian only and every locale served the Latvian picture. Locale suffixes are recognized from the enabled sites, resolved paths are memoized per request, and a path whose locale already matches costs no library lookup.'
2.0.64:
  - 'ProductStructuredData builds the product page schema.org JSON in PHP, exposed to Twig as product_json_ld: an Offer only for a sellable offer with a price above zero, rating and reviews only from rated reviews, currency from the offer, GS1-valid codes as gtin, other codes as mpn. Search Console flagged nailscosmetics.lv with "Missing field price (in offers)" because the Twig block printed an empty price for every product without an active offer and a fabricated five-star rating for products without reviews.'
2.0.65:
  - 'Shop categories get a pagefinder type that works. Shopaholic lists shop-category on cms.pageLookup.* but its resolver throws, so category banners kept absolute https://nailscosmetics.lv/lv/... URLs that sent every /en/ and /ru/ visitor to the Latvian page. shop-category-slug is keyed by slug like the product and promo block types, and because the catalog route carries the whole ancestor chain it loads the CategoryItem to build the params - one indexed slug lookup per banner, memoized per request, against the tree the header menu already primed.'
2.0.66:
  - 'Public reviews are validated and moderated. MakeReview accepted anonymous input with the product id as the only rule, so a request could set any rating and an unbounded comment, and review_activation published it at once. ReviewValidationHandler extends the Review model with bounds: rating integer 1 to 5, name and email max 191, email format, phone max 64, comment max 2000, product id required integer. review_activation was set to 0 on both prods so new reviews wait for backend approval. Integration test covers the rule set and the reject and pass paths.'
2.0.67:
  - 'Fix the review handler directory case so it loads on Linux. The 2.0.66 handler sat in classes/event/Review with a capital R; every sibling event directory is lowercase and the October class loader lowercases the path, so the class resolved on case-insensitive Windows but not on the deploy target, which aborted october:migrate. Directory renamed to classes/event/review, namespace unchanged.'
2.0.68:
  - 'Codes in the GS1 restricted-circulation ranges (GTIN-13 prefixes 020-029, 040-049, 200-299) are emitted as mpn, not gtin. The 1C feed uses the 2... range for products without a real barcode, and Google rejects such values as invalid GTINs.'

2.0.69:
  - 'Meta events carry the customer identity. CustomerIdentityHandler answers Metapixel''s user_data.resolve hook with the logged-in account''s email, phone, name and user id plus the city and postcode of the latest address that has them, or with the email and phone a guest typed into checkout when the cart holds them; Metapixel hashes the values into ViewContent, AddToCart, PageView and Search and into the browser pixel''s Advanced Matching. National 8-digit phone numbers get the shop''s dial code from the app URL domain. Country is not sent because the checkout stores it as a free-text label.'

2.0.70:
  - 'The Meta identity listener moved into Metapixel 2.1.1 (Settings > Meta Pixel > Advanced: switch on "account identity" and set the dial code 371 / 47 / 370 per shop). CustomerIdentityHandler is deleted with its guest cart and address city/zip lookups: the cart branch never fired because nothing writes carts.user_data, and the address query cost one query per logged-in page view for data present on about 5 percent of address rows.'

2.0.71:
  - 'Guest checkout identity for Meta. GuestCheckoutIdentityHandler answers Metapixel''s user_data.resolve hook for a guest with the name, last name, email and phone the cart row holds from checkout (Cart::onSaveData), read by cookie id without minting a cart, behind Metapixel''s account identity toggle and dial code; logged-in accounts stay with Metapixel''s own listener. Cart.getSavedUserData() returns the same four fields to Twig for the checkout prefill.'

2.0.72:
  - 'Pickup points come from the carrier feeds through the shop. GET /api/pickup-points/{carrier}/{country} serves DPD Baltics and Omniva parcel machines as one normalised list (id, name, address, city, zip, country) from storage/app/pickup-points/{carrier}.json, refreshed daily at 04:10 by storeextender:refresh-pickup-points and on the first read after 24 hours; a dead feed leaves the stored file in place. Replaces the checkout''s fetch of two hand-updated GitHub copies (DPD from 2024-09, Omniva from 2021-02) that named lockers no longer in service. The dead /api/offers colour experiment route and its view are gone.'
2.0.73:
  - 'CategorySorter, storeextender:sort_categories and the afterImport hook are gone. The category importer in ExtendShopaholic 1.0.24 places each category among its siblings by code as it imports, so nothing re-sorts the tree afterwards.'

2.0.74:
  - 'The school group handler runs once per save and only when the school-name property changed. It used to fire twice on registration and on every later save (checkout phone, profile edit), logging "Group with code not found" for the 16 accounts whose backend-typed school code is junk.'

2.0.75:
  - 'SafeAjaxResponse now reports every unintended AJAX exception before masking its message, so query errors and other internals reach the log with debug off. The Larajax controller swallows handler exceptions itself, so nothing else logged them. Upstream larajax merged the same fix (PR 17) but has not released it past v2.2.3.'

2.0.76:
  - 'Offer color sync runs once a day at 07:00 Riga instead of hourly, and a new Settings page (Shopaholic, Offer color sync) shows the import state and runs the sync on demand. Colors change only after a manual curation on nailolab.com, which sleeps between requests, so the hourly poll mostly woke it for a 304. The client no longer logs the 304 and names FamilyApiClient in its own warnings.'
