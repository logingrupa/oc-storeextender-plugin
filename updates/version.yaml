1.0.1: First version of StoreExtender for Shopaholic
1.0.2:
  - 'Update lovata_shopaholic_products, table, by adding video_link and how_to fields'
  - update_table_lovata_shopaholic_products.php
1.0.3:
  - 'Added payment_type_id field to user group table'
  - update_table_user_group_1.php
1.0.4:
  - 'Create discounts and price type'
  - seeder_create_default_discounts.php
1.0.5:
  - 'Update lovata_shopaholic_offers, table, by adding variations field'
  - update_table_lovata_shopaholic_offers.php
1.0.6:
  - 'Update lovata_shopaholic_products, table, by adding show_dropdown to check if display dropdown or images for products'
  - update_table_lovata_shopaholic_products_added_aditional_field.php
1.0.7:
  - 'Update lovata_shopaholic_offers, table, by adding preview_video field'
  - update_table_lovata_shopaholic_offers_add_preview_video_id.php
2.0.1:
  - 'Added also support for RainLab.User plugin, and OctoberCMS v4.0.x'
2.0.2:
  - 'Increase currency rate column precision from decimal(8,2) to decimal(12,6)'
  - update_table_currency_increase_rate_precision.php
2.0.3:
  - 'Redirect to order page instead of homepage after payment gateway cancel/return'
2.0.4:
  - 'Guard null in RoundedCurrencyHelper::convert to fix PHP 8.4 round(null) deprecation'
2.0.5:
  - 'Update lovata_shopaholic_products table by adding manufacturer and ingredients fields'
  - update_table_lovata_shopaholic_products_add_manufacturer_and_ingredients.php
2.0.6:
  - 'Convert rainlab_translate_attributes.model_id to INT UNSIGNED and add composite (model_type, model_id) index - fixes per-model translate lookups scanning all rows of a model_type'
  - update_table_rainlab_translate_attributes_model_id_type.php
2.0.7:
  - 'Fall back to primary site Shopaholic settings on sites without own record - fixes empty search settings on /en and /ru'
2.0.8:
  - 'Toolbox settings join the site fallback (fixes 0-decimal prices on /en and /ru); local offer color table + storeextender:sync-offer-colors command + OfferSheet component'
  - create_table_offer_colors.php
2.0.9:
  - 'OfferSheet select mode + inline swatch data; locale and currency aware sheet cache epoch; getSelectedOfferItem on CustomProductPage'
2.0.10:
  - 'Offer color sync schedule relaxed from hourly to twice daily at 09:00 and 13:00'
2.0.11:
  - 'Color API host read via services.color_lab.host app config so cached production config resolves it (runtime env() is empty after config:cache)'
2.0.12:
  - 'storeextender:import-theme-messages command - imports active theme configs/lang.yaml into RainLab Translate messages and clears sheet HTML cache (deploy step)'
2.0.13:
  - 'getInlineSwatchData: family filter (all family shades inline), 12-shade window around the selected offer, explicit-offer-wins conflict rule, sActiveFamily in the payload'
2.0.14:
  - 'vite_entry() Twig helper - renders script/style/modulepreload tags for a theme Vite entry from its build manifest, or from the Vite dev server while the hot file exists'
2.0.15:
  - 'LazyPromoBlockLoader: every promo tab is lazy, including the first, which is requested as soon as the control connects rather than built in onRun(); tab panes are switched by the control itself, because data-toggle="tab" had no Bootstrap JS behind it on migrated layouts; skeleton CSS moved out of the inline style into the theme bundle'
2.0.16:
  - 'LazyPromoBlockLoader: the skeleton reserves one placeholder per card the handler will actually return instead of a fixed five, removing 0.20 of cumulative layout shift on the home page'
2.0.17:
  - 'LazyPromoBlockLoader: the skeleton card now matches a loaded card exactly - the form wrapper product-card.htm uses, so the placeholder column and the real column are the same height and the tab does not move when the response lands'
